<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Vibe</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Orqa fon rasmi va gradient qoplama */
    .background {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background-image: url('background.png'); /* <--- bu yerga o‘zing yuklagan r */
      background-size: cover;
      background-position: center;
      filter: brightness(0.7) blur(4px);
      z-index: -2;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
      z-index: -1;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 600px;
      animation: fadeIn 1.2s ease-out;
    }

    h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(0,0,0,0.6);
      animation: slideDown 1s ease-out;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      color: #f1f1f1;
      margin-bottom: 35px;
      animation: fadeIn 1.5s ease-out;
    }

    a.upload-btn {
      text-decoration: none;
      background: linear-gradient(90deg, #00bcd4, #2196f3);
      padding: 14px 36px;
      border-radius: 50px;
      color: white;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(33,150,243,0.3);
      transition: all 0.3s ease;
    }

    a.upload-btn:hover {
      background: linear-gradient(90deg, #2196f3, #00bcd4);
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(33,150,243,0.5);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      p { font-size: 1rem; }
      a.upload-btn { padding: 12px 28px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="background"></div>
  <div class="overlay"></div>

  <div class="container">
    <h1>Music Vibe</h1>
    <p>Faqat Sen va Musiqa.”</p>
    <a href="upload.html" class="upload-btn">Musics</a>
  </div>

</body>

</html>
