<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Vibe</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      height: 100vh;
      background: url('background.jpg') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      z-index: 0;
    }

    h1 {
      position: relative;
      font-size: 2.8rem;
      margin-bottom: 20px;
      z-index: 1;
      animation: fadeIn 1s ease;
    }

    p.description {
      position: relative;
      max-width: 600px;
      line-height: 1.6;
      font-size: 1.1rem;
      color: #e5e5e5;
      margin-bottom: 40px;
      z-index: 1;
      animation: fadeIn 1.5s ease;
    }

    a.button {
      position: relative;
      display: inline-block;
      background: linear-gradient(135deg, #00e0ff, #0072ff);
      color: white;
      padding: 14px 30px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 1;
      animation: fadeIn 2s ease;
    }

    a.button:hover {
      transform: scale(1.07);
      background: linear-gradient(135deg, #00bfff, #0066cc);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9rem;
      color: #ccc;
      z-index: 1;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2.2rem; }
      p.description { font-size: 1rem; padding: 0 20px; }
    }
  </style>
</head>
<body>

  <h1>🎵 Mening Musiqa To‘plamim</h1>

  <p class="description">
    Bu mening birinchi saytim.Bu sayt orqali men o'zim maroq bilan tinglaydigan qo'shiqlarimni sizlarg ulashmoqchiman. 
  </p>

  <a href="upload.html" class="button">Qo‘shiqlar sahifasiga o‘tish 🎶</a>

  <footer>© Music Vibe</footer>

</body>
</html>
